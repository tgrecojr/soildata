services:
  app:
    build: .
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-uscrn}
      - DB_USER=${POSTGRES_USER:-uscrn}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-uscrn_password}
      - RUST_LOG=info,uscrn_ingest=debug
      # Bronze raw-capture layer. Disabled by default: unset or empty = noop.
      # Uncomment (and the volume below) to capture raw NOAA responses to disk.
      # - BRONZE_ROOT=/data/bronze
    volumes:
      - ./config:/app/config:ro
      # Bronze capture target — pair with BRONZE_ROOT above.
      # - ./bronze:/data/bronze
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uscrn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uscrn_password}
      POSTGRES_DB: ${POSTGRES_DB:-uscrn}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uscrn}"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  grafana_data:
